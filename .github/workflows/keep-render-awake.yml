# Keeps the Render free-tier backend from spinning down (it sleeps after ~15 min idle).
# Works together with server/src/services/keepAlive.js, which self-pings while awake;
# this external ping is what wakes the server if it ever does fall asleep.
#
# GitHub's scheduler is best-effort (runs can start a few minutes late), and it pauses
# scheduled workflows after 60 days without repository activity — re-enable it from the
# Actions tab if that happens. Override the URL with a repository variable
# RENDER_HEALTH_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-render-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping backend health endpoint
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://collabboard-glzt.onrender.com/health' }}
        run: |
          # A cold start can take ~60s, so allow a long timeout and retry.
          curl --fail --silent --show-error \
               --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors \
               "$HEALTH_URL"
          echo
